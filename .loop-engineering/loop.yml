objective: "Replace HLP-007 timestamp and padding wrappers with Kujo-native now_utc and pad_right while preserving report output."
checklist_file: ""
max_iterations: 8
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: tests
    command: "KUJO=${KUJO:-../kujo/target/debug/kujo} ./tests/run.sh"
    required: true
  - id: diff_check
    command: 'files=$(git diff --name-only | grep -v "^.loop-engineering/" || true); if [ -n "$files" ]; then git diff --check -- $files; fi'
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
